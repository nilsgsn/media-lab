<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Media Lab – Lehrkraft</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#3b879c">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧑‍🏫</text></svg>">
  <style>
    body { padding-bottom: 24px; }
    main { max-width: 1100px; }
    .ttabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .ttabs button { font: inherit; border: 2px solid var(--petrol); background: #fff; color: var(--petrol); border-radius: 99px; padding: 7px 16px; cursor: pointer; }
    .ttabs button.on { background: var(--petrol); color: #fff; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 12px; }
    .kpis .card { margin: 0; }
    .scroll { overflow-x: auto; }
    table.t { border-collapse: collapse; width: 100%; font-size: 15px; }
    table.t th, table.t td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
    table.t th { cursor: pointer; color: var(--muted); font-weight: 700; font-size: 13px; user-select: none; }
    table.t td.num, table.t th.num { text-align: right; }
    .pct { display: inline-block; min-width: 42px; text-align: center; border-radius: 6px; padding: 1px 4px; font-size: 13px; }
    .p-hi { background: #e3f5ea; color: var(--ok); } .p-mid { background: #fbf6dc; color: #8a6d00; } .p-lo { background: #fbe7e5; color: var(--bad); }
    .days { display: flex; align-items: flex-end; gap: 6px; height: 140px; padding-top: 10px; }
    .days div { flex: 1; text-align: center; font-size: 11px; color: var(--muted); }
    .days span { display: block; background: var(--cyan); border-radius: 6px 6px 0 0; margin-bottom: 4px; min-height: 2px; }
    .blocked td { opacity: .45; }
    select { font: inherit; padding: 8px 10px; border-radius: 10px; border: 2px solid var(--line); background: #fff; }
    .codes { font-family: ui-monospace, Menlo, monospace; font-size: 15px; line-height: 1.9; word-spacing: 10px; }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">🧑‍🏫 Media Lab · Lehrkraft</div>
    <div class="me" id="me"></div>
  </header>
  <main id="main"></main>
  <script src="teacher.js"></script>
</body>
</html>
